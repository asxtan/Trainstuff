<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Commute Board</title>
  <meta name="theme-color" content="#0b1f17" />
  <meta name="description" content="Live UK train departures for your commute." />

  <!-- PWA / iOS Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Commute" />

  <link rel="stylesheet" href="styles.css?v=11" />

  <!-- Resolve the saved theme before first paint to avoid a flash of the
       wrong colours. "auto" follows the OS preference. -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("cmt.theme") || "auto";
        var dark = pref === "dark" ||
          (pref === "auto" && window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0b1f17" : "#eef3ef");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <div class="mode-toggle" role="tablist" aria-label="Direction">
        <button id="mode-work" class="seg" type="button" role="tab">To work</button>
        <button id="mode-home" class="seg" type="button" role="tab">To home</button>
        <button id="mode-trip" class="seg" type="button" role="tab">Trip</button>
      </div>
      <button id="refresh-btn" type="button" class="icon-btn refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button id="settings-btn" class="icon-btn gear" type="button" aria-label="Edit stations" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <div id="return-pick" class="return-pick" hidden>
      <span class="rp-label">Returning from</span>
      <div class="seg-group">
        <button id="ret-a" class="seg" type="button"></button>
        <button id="ret-b" class="seg" type="button"></button>
      </div>
    </div>

    <!-- One-off journey lookup: any two stations, at any time in Darwin's window. -->
    <div id="trip-pick" class="trip-pick" hidden>
      <div class="trip-row">
        <div class="field">
          <label for="trip-from-input">From</label>
          <input id="trip-from-input" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Station" />
          <ul id="trip-from-list" class="suggestions" hidden></ul>
        </div>
        <div class="field">
          <label for="trip-to-input">To <span class="opt">(optional)</span></label>
          <input id="trip-to-input" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Anywhere" />
          <ul id="trip-to-list" class="suggestions" hidden></ul>
        </div>
      </div>
      <div class="trip-row time-row">
        <div class="field">
          <label for="trip-time-input">Leaving at</label>
          <input id="trip-time-input" type="time" step="60" />
        </div>
        <button id="trip-now" class="seg trip-now" type="button">Now</button>
      </div>
    </div>

    <div class="status-line">
      <span id="route-label" class="route"></span>
      <span id="updated" class="updated"></span>
    </div>

    <div id="settings" class="settings" hidden>
      <div class="field">
        <label for="home-input">Home station</label>
        <input id="home-input" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Station" />
        <ul id="home-list" class="suggestions" hidden></ul>
      </div>
      <div class="field">
        <label for="a-input">Work station A</label>
        <input id="a-input" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Station" />
        <ul id="a-list" class="suggestions" hidden></ul>
      </div>
      <div class="field">
        <label for="b-input">Work station B <span class="opt">(optional — leave blank for one)</span></label>
        <input id="b-input" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Optional" />
        <ul id="b-list" class="suggestions" hidden></ul>
      </div>
      <div class="theme-row">
        <span class="field-label">Appearance</span>
        <div id="theme-seg" class="theme-seg" role="radiogroup" aria-label="Appearance">
          <button id="theme-auto" class="seg" type="button" role="radio">Auto</button>
          <button id="theme-light" class="seg" type="button" role="radio">Light</button>
          <button id="theme-dark" class="seg" type="button" role="radio">Dark</button>
        </div>
      </div>
      <button id="settings-done" class="seg done" type="button">Done</button>
    </div>
  </header>

  <main id="board" class="board" aria-live="polite">
    <p class="placeholder">Loading departures…</p>
  </main>

  <div id="banner" class="banner" hidden></div>

  <footer class="footer">
    <span class="credit">Powered by National Rail Enquiries Darwin</span>
  </footer>

  <script src="config.js?v=5"></script>
  <script src="app.js?v=15"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
